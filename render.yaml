services:
  - type: worker
    name: userbot-host
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URL
        sync: false
      - key: SESSION_KEY
        sync: false
      - key: VENICE_API_KEY
        sync: false
      - key: MAX_USERS
        value: "12"
      - key: AUTO_PROMO
        value: "false"
      - key: PROMO_INTERVAL_SECONDS
        value: "86400"
      - key: TAGALL_MAX_MEMBERS
        value: "5000"
      - key: TAGALL_BATCH_SIZE
        value: "8"
      - key: TAGALL_DELAY_SECONDS
        value: "3"
      - key: TAGALL_COOLDOWN
        value: "3600"
      - key: DM_COOLDOWN
        value: "3600"
      - key: AI_BASE_URL
        value: https://api.venice.ai/api/v1
