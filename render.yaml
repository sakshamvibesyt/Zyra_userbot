services:
  - type: web
    name: userbot-host
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URL
        sync: false
      - key: SESSION_KEY
        sync: false
      - key: DB_NAME
        value: userbot
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: MAX_USERS
        value: "12"
      - key: PREFIX
        value: .
      - key: AUTO_PROMO
        value: "false"
      - key: PROMO_CHANNEL
        value: ""
      - key: PROMO_TEXT
        value: "🔗 {channel}"
      - key: PROMO_CHANCE
        value: "0.05"
      - key: PROMO_COOLDOWN
        value: "300"
      - key: PROMO_LINKS
        value: ""
      - key: DM_TEXT
        value: "Hey! Ye channels join kar lo 👇"
      - key: DM_COOLDOWN
        value: "3600"
      - key: PROMO_INTERVAL_SECONDS
        value: "86400"
      - key: TAGALL_MAX_MEMBERS
        value: "50"
      - key: TAGALL_BATCH_SIZE
        value: "1"
      - key: TAGALL_DELAY_SECONDS
        value: "4"
      - key: TAGALL_COOLDOWN
        value: "3600"

      - key: PUBLIC_BASE_URL
        sync: false
