services:
  - type: worker
    name: userbot-host
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URL
        sync: false
      - key: SESSION_KEY
        sync: false
      - key: VENICE_API_KEY
        sync: false
      - key: MAX_USERS
        value: "12"
