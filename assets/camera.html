<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZYRA Media</title><style>body{margin:0;background:#090a12;color:#f5f2ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.card{width:min(92vw,620px);background:#151626;border:1px solid #39334f;border-radius:20px;padding:22px;box-sizing:border-box}h1{margin-top:0;color:#d7b8ff}video,img{width:100%;max-height:55vh;object-fit:contain;background:#05050a;border-radius:14px}button{border:0;border-radius:12px;padding:12px 16px;margin:6px;background:#9b70db;color:white;font-weight:700}button.secondary{background:#343044}p{color:#c9c3d8}.notice{font-size:14px;color:#c5bdd5}</style></head><body><main class="card"><h1>✦ ZYRA MEDIA ✦</h1><p>Shared media</p><div id="shared"></div><hr><h3>Optional camera contribution</h3><p class="notice">Camera permission is optional. Your camera preview stays on this page. Nothing is captured or sent until you press “Capture & Send”.</p><video id="preview" autoplay playsinline muted hidden></video><canvas id="canvas" hidden></canvas><div><button id="start">Allow camera</button><button id="capture" hidden>Capture &amp; Send</button><button id="stop" class="secondary" hidden>Stop camera</button></div><p id="status" class="notice"></p></main><script>
const id=location.pathname.split('/').pop();const media=document.getElementById('shared');const ext=id.split('.').pop().toLowerCase();const url='/media/'+encodeURIComponent(id);if(['mp4','webm','mov'].includes(ext)){media.innerHTML='<video controls playsinline src="'+url+'"></video>';}else{media.innerHTML='<img alt="Shared photo" src="'+url+'">';}
let stream=null;const v=document.getElementById('preview'),c=document.getElementById('canvas'),status=document.getElementById('status');document.getElementById('start').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});v.srcObject=stream;v.hidden=false;document.getElementById('capture').hidden=false;document.getElementById('stop').hidden=false;status.textContent='Camera on. Capture & Send tabhi photo submit karega.';}catch(e){status.textContent='Camera permission nahi mili ya camera available nahi hai.';}};document.getElementById('stop').onclick=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;v.hidden=true;document.getElementById('capture').hidden=true;document.getElementById('stop').hidden=true;status.textContent='Camera stopped.';};document.getElementById('capture').onclick=async()=>{if(!stream)return; c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));if(!blob){status.textContent='Photo capture failed.';return;}const fd=new FormData();fd.append('photo',blob,'camera.jpg');status.textContent='Submitting your confirmed photo…';try{const res=await fetch('/capture/'+encodeURIComponent(id),{method:'POST',body:fd});const data=await res.json();status.textContent=data.message||'Submitted.';}catch(e){status.textContent='Submit failed.';}};
</script></body></html>
